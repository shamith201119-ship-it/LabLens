<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="LabLens pipeline: Upload, Extract locally, Verify every value, Analyse, Print for your appointment">
  <rect width="1280" height="300" fill="#F7F8F3"/>

  <!-- step 1 -->
  <g>
    <rect x="20" y="70" width="218" height="150" rx="18" fill="#FFFFFF" stroke="#E4EAE3" stroke-width="1.5"/>
    <rect x="20" y="70" width="218" height="40" rx="18" fill="#12251F"/>
    <rect x="20" y="89" width="218" height="21" fill="#12251F"/>
    <text x="44" y="96" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#C9F277">STEP 1</text>
    <text x="44" y="141" font-family="Manrope,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#12251F">Upload</text>
    <text x="44" y="166" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">PDF or photo of</text>
    <text x="44" y="184" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">your lab report</text>
  </g>

  <path d="M252 150 h38" stroke="#12251F" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M290 144 l10 6 -10 6" fill="none" stroke="#12251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 2 -->
  <g>
    <rect x="312" y="70" width="218" height="150" rx="18" fill="#FFFFFF" stroke="#E4EAE3" stroke-width="1.5"/>
    <rect x="312" y="70" width="218" height="40" rx="18" fill="#12251F"/>
    <rect x="312" y="89" width="218" height="21" fill="#12251F"/>
    <text x="336" y="96" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#C9F277">STEP 2</text>
    <text x="336" y="141" font-family="Manrope,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#12251F">Extract locally</text>
    <text x="336" y="166" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">Offline OCR &amp; direct</text>
    <text x="336" y="184" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">text-layer reading</text>
  </g>

  <path d="M544 150 h38" stroke="#12251F" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M582 144 l10 6 -10 6" fill="none" stroke="#12251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 3 -->
  <g>
    <rect x="604" y="52" width="240" height="186" rx="18" fill="#12251F"/>
    <rect x="604" y="231" width="240" height="7" fill="#C9F277"/>
    <text x="628" y="101" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#78CFC0">STEP 3 — YOU</text>
    <text x="628" y="141" font-family="Manrope,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#F7F8F3">Verify every value</text>
    <text x="628" y="166" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#DCE7DF">Nothing enters analysis</text>
    <text x="628" y="184" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#DCE7DF">until you confirm it</text>
  </g>

  <path d="M858 150 h38" stroke="#12251F" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M896 144 l10 6 -10 6" fill="none" stroke="#12251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 4 -->
  <g>
    <rect x="918" y="70" width="150" height="150" rx="18" fill="#FFFFFF" stroke="#E4EAE3" stroke-width="1.5"/>
    <rect x="918" y="70" width="150" height="40" rx="18" fill="#12251F"/>
    <rect x="918" y="89" width="150" height="21" fill="#12251F"/>
    <text x="942" y="96" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#C9F277">STEP 4</text>
    <text x="942" y="141" font-family="Manrope,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#12251F">Analyse</text>
    <text x="942" y="166" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">Rules + patterns,</text>
    <text x="942" y="184" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5B675F">with provenance</text>
  </g>

  <path d="M1082 150 h22" stroke="#12251F" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M1104 144 l10 6 -10 6" fill="none" stroke="#12251F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
